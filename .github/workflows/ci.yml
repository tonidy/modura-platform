name: CI

# The checks that `pnpm verify` runs in one go locally are split across parallel jobs
# here, so the run takes as long as its slowest job. Every target of `pnpm verify` is
# covered by exactly one job below:
#   typecheck, lint, test, generate-check, registry-check: ts (TypeScript projects)
#                                                         and go (the registry's own project)
#   parity, fuzz: parity-fuzz
# Jobs that touch Postgres have their own service container and MODURA_REQUIRE_DB=1,
# so a missing database fails the run instead of skipping tests.

on:
  push:
    branches: [main]
  pull_request:

env:
  NX_DAEMON: "false"

jobs:
  # TypeScript projects: typecheck, lint, unit tests, stale-artifact and registry checks.
  # fetch-depth 0 because `registry verify` reads release history from git.
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          install: "true"
      - run: >-
          pnpm nx run-many --parallel=4
          -t typecheck lint test generate-check registry-check
          --exclude=@modura/registry-go
      # The platform packages must stay publishable on JSR (plan M9): extensions,
      # explicit types in the public API, licence, file lists. --no-check because tsc
      # already type-checks everything above, and Deno cannot read the types of
      # @modelcontextprotocol/sdk subpaths (its `./*` export maps `types.js` to
      # `types.js.d.ts`).
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Platform packages are publishable on JSR
        run: deno publish --dry-run --no-check

  # Go (the registry): vet, tests (contract and concurrency tests
  # against Postgres) and the stale oapi-codegen output check. Needs no node_modules: pnpm only runs the package scripts.
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: modura
          POSTGRES_PASSWORD: modura
          POSTGRES_DB: modura
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U modura -d modura"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://modura:modura@localhost:5432/modura?sslmode=disable
      MODURA_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          go: "true"
      - run: pnpm --filter @modura/registry-go run typecheck
      - run: pnpm --filter @modura/registry-go run test
      - run: pnpm --filter @modura/registry-go run generate-check

  # TypeScript/Go random compatibility parity, then the two Go fuzz targets (10 s each).
  parity-fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          install: "true"
          go: "true"
      - run: pnpm --filter @modura/scripts run parity
      - run: pnpm --filter @modura/registry-go run fuzz

  # Regenerate everything and fail on any diff.
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          install: "true"
          go: "true"
      - run: pnpm generate && git diff --exit-code

  # Pull requests only: compare against the base branch (needs its history).
  base-branch:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          install: "true"
      - name: Contract compatibility with the base branch
        run: pnpm modura compat --against origin/${{ github.base_ref }}
      # The file registry (ADR-0012): releases on the base branch are unchanged, and any
      # new release is exactly what `modura publish` would have written. Make this a
      # required check, or anyone who can push can rewrite the history.
      - name: Release history is append-only
        run: pnpm modura registry verify --since origin/${{ github.base_ref }}
      - name: The calculator example's release history is append-only
        run: pnpm --filter @modura/example-calculator run modura registry verify --since origin/${{ github.base_ref }}

  # CLI -> generated client -> registry (Go) -> Postgres, and an MCP client reading
  # through the MCP server. No browser: no test uses `page`.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: modura
          POSTGRES_PASSWORD: modura
          POSTGRES_DB: modura
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U modura -d modura"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      MODURA_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          install: "true"
          go: "true"
      - run: pnpm e2e
        env:
          E2E_DATABASE_URL: postgres://modura:modura@localhost:5432/modura_e2e?sslmode=disable
          DATABASE_URL: postgres://modura:modura@localhost:5432/modura?sslmode=disable
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: tests/e2e/test-results
